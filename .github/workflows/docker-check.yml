name: POMP NET - Docker Build and Runtime Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project files and ports
        shell: bash
        run: |
          set -eu

          test -s Dockerfile
          test -s railway.toml
          test -s pompnet_brand.py

          grep -q 'dockerfilePath = "Dockerfile"' railway.toml
          grep -q -- '--port 8080' railway.toml
          grep -q 'EXPOSE 8080' Dockerfile

          echo "PASS: Required files and port settings verified."

      - name: Build Docker image
        run: docker build --pull --tag pompnet-panel:ci .

      - name: Start application container
        shell: bash
        run: |
          set -eu

          mkdir -p "$RUNNER_TEMP/pompnet-data"

          docker run --detach \
            --name pompnet-panel-ci \
            --publish 8080:8080 \
            --env DATA_DIR=/data \
            --env SECRET_KEY=ci-only-test-secret-change-me \
            --volume "$RUNNER_TEMP/pompnet-data:/data" \
            pompnet-panel:ci

      - name: Wait for application health
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8080/healthz"
          deadline = time.time() + 180
          last_error = "No response yet"

          while time.time() < deadline:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "POMP-NET-CI"}
                  )

                  with urllib.request.urlopen(
                      request, timeout=8
                  ) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f"Unexpected HTTP status: {response.status}"
                          )

                      data = json.loads(
                          response.read().decode("utf-8")
                      )

                  if data.get("ok") is not True:
                      raise RuntimeError(
                          f"Health check failed: {data!r}"
                      )

                  print("PASS: /healthz returned HTTP 200 and ok=true.")
                  break

              except Exception as error:
                  last_error = repr(error)
                  time.sleep(3)

          else:
              print("FAIL: Application health check timed out.")
              print("Last error:", last_error)
              raise SystemExit(1)
          PY

      - name: Test login page
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request

          url = "http://127.0.0.1:8080/login"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "POMP-NET-CI"}
          )

          with urllib.request.urlopen(
              request, timeout=15
          ) as response:
              body = response.read().decode(
                  "utf-8", errors="replace"
              )

              if response.status != 200:
                  raise SystemExit(
                      f"FAIL: Login returned HTTP {response.status}"
                  )

              if "<html" not in body.lower():
                  raise SystemExit(
                      "FAIL: Login did not return an HTML document."
                  )

          print("PASS: Login page returned HTTP 200 with HTML.")
          PY

      - name: Print logs if a test fails
        if: failure()
        run: docker logs pompnet-panel-ci || true

      - name: Clean up test container
        if: always()
        run: docker rm --force pompnet-panel-ci || true
