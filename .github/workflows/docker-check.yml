name: POMP NET - Docker Build and Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -eu

          test -f Dockerfile
          test -f railway.toml
          test -f pompnet_brand.py

          echo "PASS: Required repository files exist."

      - name: Build Docker image
        run: |
          docker build --pull -t pompnet-panel:test .

      - name: Start application
        run: |
          mkdir -p "$RUNNER_TEMP/pompnet-data"

          docker run -d \
            --name pompnet-panel-test \
            -p 8080:8080 \
            -e DATA_DIR=/data \
            -e SECRET_KEY=ci-only-test-secret-change-me \
            -v "$RUNNER_TEMP/pompnet-data:/data" \
            pompnet-panel:test

      - name: Test HTTP response
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8080/"
          deadline = time.time() + 120
          last_error = "No response yet"

          while time.time() < deadline:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "POMP-NET-GitHub-Actions"
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=5
                      ) as response:
                          status = response.status
                  except urllib.error.HTTPError as error:
                      status = error.code

                  if 200 <= status < 500:
                      print(
                          f"PASS: HTTP response received: {status}"
                      )
                      break

                  last_error = f"Unexpected HTTP status: {status}"

              except Exception as error:
                  last_error = repr(error)

              time.sleep(3)
          else:
              print("FAIL: Application did not respond in time.")
              print("Last error:", last_error)
              raise SystemExit(1)
          PY

      - name: Show logs if a step fails
        if: failure()
        run: |
          docker logs pompnet-panel-test || true

      - name: Remove test container
        if: always()
        run: |
          docker rm -f pompnet-panel-test || true
