name: POMP NET Docker Build and Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build real Docker image
        run: |
          docker build --pull -t pompnet-panel:ci .

      - name: Start application container
        run: |
          mkdir -p "$RUNNER_TEMP/pompnet-data"

          docker run -d \
            --name pompnet-panel-ci \
            -p 8080:8080 \
            -e DATA_DIR=/data \
            -e SECRET_KEY=ci-only-test-secret-change-me \
            -v "$RUNNER_TEMP/pompnet-data:/data" \
            pompnet-panel:ci

      - name: Wait for application HTTP response
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8080/"
          deadline = time.time() + 120
          last_error = None

          while time.time() < deadline:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "POMP-NET-CI-Smoke-Test"}
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=5
                      ) as response:
                          status = response.status
                  except urllib.error.HTTPError as error:
                      status = error.code

                  if 200 <= status < 500:
                      print(
                          "PASS: application returned HTTP",
                          status
                      )
                      break

                  last_error = f"Unexpected HTTP status: {status}"

              except Exception as error:
                  last_error = repr(error)

              time.sleep(3)
          else:
              print("FAIL: application did not become responsive.")
              print("Last error:", last_error)
              raise SystemExit(1)
          PY

      - name: Show application logs on failure
        if: failure()
        run: |
          docker logs pompnet-panel-ci || true

      - name: Remove test container
        if: always()
        run: |
          docker rm -f pompnet-panel-ci || true
